name: Express Web

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract sources.zip
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: 7z x sources.zip -p"${ZIP_PASS}" -o. -y

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm install --omit=dev --silent

      - name: Save node_modules
        if: always()
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package.json') }}

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Run Web
        timeout-minutes: 358
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          node server.js &
          cloudflared tunnel --no-autoupdate run --token $CF_TOKEN > /dev/null 2>&1 &
          wait

      - name: Self Restart
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/web.yml/dispatches \
            --data '{"ref":"main"}'
            